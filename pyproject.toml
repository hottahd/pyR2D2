[build-system]
requires = [
    "setuptools>=69",
    "setuptools_scm[toml]>=8",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyR2D2"
dynamic = ["version"]
description = "Python tools for reading and analyzing R2D2 simulation data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.10,<2",
]

[project.optional-dependencies]
zarr = ["zarr>=3.0.8,<4"]
plot = ["matplotlib>=3.7"]
all = [
    "zarr>=3.0.8,<4",
    "matplotlib>=3.7",
]

[project.urls]
Documentation = "https://hottahd.github.io/pyR2D2/master"
Repository = "https://github.com/hottahd/pyR2D2"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyR2D2", "pyR2D2.*"]

[tool.setuptools.package-data]
"pyR2D2.data_io" = ["*.json"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"
version_file = "pyR2D2/_version.py"
