[build-system]
requires = [
    "setuptools>=69",
    "setuptools_scm[toml]>=8",
    "pybind11>=2.10.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyR2D2"
dynamic = ["version"]
description = "Python tools for reading and analyzing R2D2 simulation data"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: C++",
]
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.10,<2",
]

[project.scripts]
# ランの一覧 (台帳) を Google スプレッドシートへ送る。push だけ gspread と google-auth が要る
r2d2plus-ledger = "pyR2D2.ledger.cli:main"

[project.optional-dependencies]
zarr = ["zarr>=3.0.8,<4"]
plot = ["matplotlib>=3.7"]
# R2D2plus の新出力形式 (format = "compressed"): zstd (zarr を入れれば入る) と
# 初期状態ファイルを書くときの XXH3-64 (write_initial_state)
compressed = ["numcodecs>=0.13", "xxhash>=3"]
# r2d2plus-ledger push (Google スプレッドシート)
ledger = ["gspread>=5", "google-auth>=2"]
all = [
    "zarr>=3.0.8,<4",
    "matplotlib>=3.7",
    "numcodecs>=0.13",
    "xxhash>=3",
]

[project.urls]
Documentation = "https://hottahd.github.io/pyR2D2/master"
Repository = "https://github.com/hottahd/pyR2D2"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pyR2D2", "pyR2D2.*"]

[tool.setuptools.package-data]
"pyR2D2.data_io" = ["*.json"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"
version_file = "pyR2D2/_version.py"

[tool.cibuildwheel]
# Python 3.12 / 3.13 の2枚。pybind11 は abi3 に対応しないので版ごとに要る。
# 3.14 は numpy/scipy のホイールが揃ってから足す。
build = "cp312-* cp313-*"
skip = "*-musllinux_* *_i686 pp*"
# setuptools_scm が git を読むので、bind mount の所有者違いで止まらないようにする
before-all = "git config --global --add safe.directory '*'"
test-command = 'python -c "import pyR2D2; from pyR2D2.cpp_util import cpp_util; print(pyR2D2.__version__)"'

[tool.cibuildwheel.linux]
# いちばん古い行き先(富岳のログインノード = RHEL8 = glibc 2.28)に合わせる。
# これで富岳も研究室の5台(glibc 2.39〜2.43)も動く。
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
# Mac は setup.py が -fopenmp を付けないので libomp は要らない
