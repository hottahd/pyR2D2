name: wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:      # 手で走らせることもできる

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]   # macos-14 は Apple Silicon
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0               # setuptools_scm がタグを読むため
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v5
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write                  # Releases に貼るため
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
